name: Deploy icon gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build time into the page
        run: |
          STAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s|__BUILD_STAMP__|${STAMP}|g" index.html
          grep -q "构建时间" index.html && echo "stamp ok" || echo "no stamp placeholder (fine)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
